# Fly.io Configuration for RAG API
# Deploy with: fly launch --copy-config --name ai-textbook-rag

app = "ai-textbook-rag"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "chroma_data"
  destination = "/app/chroma_db"

[env]
  CHROMA_DIR = "/app/chroma_db"
  COLLECTION_NAME = "ai_textbook"
  EMBEDDING_MODEL = "all-MiniLM-L6-v2"
  OPENAI_MODEL = "gpt-4o-mini"
  TOP_K = "5"
  MAX_CONTEXT_CHARS = "8000"
  PORT = "8000"
  # OPENAI_API_KEY will be set via: fly secrets set OPENAI_API_KEY=...