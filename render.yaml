# Render Blueprint for RAG API
# Deploy with: render deploy --image ai-textbook-rag
# Or: render deploy --blueprint render.yaml

services:
  - type: web
    name: ai-textbook-rag
    env: docker
    dockerfilePath: ./Dockerfile
    plan: starter          # Always-on (free tier spins down after 15min)
    region: oregon
    healthCheckPath: /health
    envVars:
      # Supabase connection (get from Supabase dashboard)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # LLM (Google Gemini)
      - key: GEMINI_API_KEY
        sync: false
      # Configuration
      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: TOP_K
        value: "5"
      - key: MAX_CONTEXT_CHARS
        value: "8000"
      - key: PORT
        value: "8000"