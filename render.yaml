# Render Blueprint for AI Textbook RAG Backend
# Deploy by connecting this repo on Render.com as a "New Blueprint"
# Render will pre-fill everything below except the secret values
# (marked sync: false), which you'll paste in during setup.

services:
  - type: web
    name: ai-textbook-rag
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      # --- Required secrets (sync: false = Render prompts you to enter these) ---
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # --- Configuration (sync: true = Render sets these from the values below) ---
      - key: COLLECTION_NAME
        value: ai_textbook
      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: TOP_K
        value: "5"
      - key: MAX_CONTEXT_CHARS
        value: "8000"